name: kamera_pro
description: "Kamera Pro — AI Voice-Controlled Professional Camera System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera — CameraX/Camera2 with advanced manual controls
  camerawesome: ^2.2.1

  # Permissions
  permission_handler: ^12.0.0+1

  # Speech recognition (on-device via Android SpeechRecognizer)
  speech_to_text: ^7.0.0

  # Gemini AI
  google_generative_ai: ^0.4.7

  # State management + DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local persistence
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^15.1.2

  # Environment variables / API key management
  flutter_dotenv: ^5.2.1

  # HTTP
  http: ^1.4.0

  # JSON serialization
  json_annotation: ^4.9.0

  # Logging
  logger: ^2.5.0

  # Utilities
  collection: ^1.19.1
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  path_provider: ^2.1.5
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.1
  json_serializable: ^6.9.5
  freezed: ^2.5.8
  mockito: ^5.4.5

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/presets/
    - assets/sounds/

  # Fonts: SpaceMono can be added later by placing TTF files in assets/fonts/
  # and un-commenting the block below.
  # fonts:
  #   - family: SpaceMono
  #     fonts:
  #       - asset: assets/fonts/SpaceMono-Regular.ttf
  #       - asset: assets/fonts/SpaceMono-Bold.ttf
  #         weight: 700
